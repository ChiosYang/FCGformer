name: fcgformer
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.8

  # PyTorch and CUDA (adjust based on your GPU)
  - pytorch>=1.10.0
  - torchvision>=0.11.0
  - pytorch-cuda=11.8  # For CUDA 11.8, adjust as needed

  # Scientific computing
  - numpy=1.23.5
  - scipy>=1.7.0

  # Data processing
  - pandas=1.5.3

  # Machine learning
  - scikit-learn=1.2.2

  # Visualization
  - matplotlib=3.7.0

  # System utilities
  - tqdm>=4.65.0
  - psutil>=5.9.0

  # Additional conda packages
  - jupyter
  - ipykernel

  # Pip dependencies not available in conda
  - pip
  - pip:
      - reformer-pytorch==1.4.4
      - nvidia-ml-py3>=7.352.0